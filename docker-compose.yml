# Dự án compose RIÊNG (-p mndo): container mndo-app, cổng 127.0.0.1:3100, volume mndo_data, mạng mndo_net.
# Không trùng gì của ERP (-p motnha: motnha-app / motnha-postgres, cổng 3000 / 5432, volume postgres_data / uploads_data).
name: mndo
services:
  app:
    build: .
    image: mndo-app:latest
    container_name: mndo-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"        # chỉ máy chủ này vào được; Internet vào qua Cloudflare Tunnel
    env_file: .env                    # do workflow ghi từ GitHub Secrets / Variables
    environment:
      - PORT=3100
      - DATA_DIR=/data
      - TIN_CF=1
    volumes:
      - mndo_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [mndo_net]
volumes:
  mndo_data:
    name: mndo_data
networks:
  mndo_net:
    name: mndo_net
